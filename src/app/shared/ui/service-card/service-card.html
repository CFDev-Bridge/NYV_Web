<article class="service-card" [class.service-card--detailed]="detailed()" [id]="service().id">
  <span class="service-card__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" focusable="false">
      @switch (service().icon) {
        @case ('code') {
          <path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16" />
        }
        @case ('data') {
          <path d="M4 19V10M10 19V5M16 19v-7M22 19H2" />
        }
        @case ('cloud') {
          <path d="M7 18a4 4 0 0 1-.6-7.95A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9H7Z" />
        }
        @case ('integration') {
          <path
            d="M8 8h8M8 16h8M8 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm14 0a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM8 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm14 0a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
          />
        }
        @case ('support') {
          <path
            d="M4 13v-2a8 8 0 0 1 16 0v2M4 13h3v6H5a1 1 0 0 1-1-1v-5Zm16 0h-3v6h2a1 1 0 0 0 1-1v-5Zm-8 8h4"
          />
        }
        @case ('strategy') {
          <path d="M4 20 10 14l4 4 6-8M14 10h6v6" />
        }
      }
    </svg>
  </span>

  <h3 class="service-card__title">{{ service().title }}</h3>
  <p class="service-card__summary">{{ service().summary }}</p>

  @if (detailed()) {
    <p class="service-card__description">{{ service().description }}</p>
    <ul class="service-card__list">
      @for (item of service().deliverables; track item) {
        <li>{{ item }}</li>
      }
    </ul>
    <a routerLink="/contacto" [queryParams]="{ servicio: service().id }" class="service-card__link">
      Solicitar información
    </a>
  } @else {
    <a routerLink="/servicios" [fragment]="service().id" class="service-card__link">
      Ver detalle
    </a>
  }
</article>
